<!doctype html>
<html lang="tr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f3">
  <meta name="description" content="PDF birleştir, ayır, sayfaları düzenle ve görselleri PDF’ye dönüştür. Tüm işlemler tarayıcınızda çalışır.">
  <title>PDF Brennt — PDF araçları</title>
  <link rel="stylesheet" href="./design/styles.css">
  <link rel="stylesheet" href="./src/app.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">İçeriğe geç</a>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="#araclar" aria-label="PDF Brennt ana sayfa">
